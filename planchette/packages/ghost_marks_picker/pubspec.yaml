name: ghost_marks_picker
description: >-
  Seance's and Poltergeist's file glue over file_picker 13 and
  file_selector: the platform image picker behind ghost_marks' mark picker,
  bounded reads of picked files and the save-as panels. Kept out of
  ghost_marks so an app on another picker, or on a file_picker major that
  needs a different win32 major, takes the shared appearance without it.
version: 1.9.4
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.3
  # The desktop save panels: only the destination, so each app keeps its
  # own atomic or streamed write (see picked_files.dart).
  file_selector: ^1.1.0
  # The save panel's types, for the scripted platform in testing.dart.
  file_selector_platform_interface: ^2.7.0
  # The badge image extensions the desktop picker offers.
  ghost_ui:
    path: ../ghost_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
