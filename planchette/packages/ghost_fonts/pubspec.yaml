name: ghost_fonts
description: >-
  Monospace fonts bundled with every Ghost app (Planchette, Poltergeist,
  Seance and Klabautermann), with the names settings store and the family
  stack code text falls back through.
version: 1.9.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Each family is registered as 'packages/ghost_fonts/<family>'; see
# BundledMonoFont. README.md records where every file comes from.
flutter:
  fonts:
    - family: Iosevka Term
      fonts:
        - asset: fonts/IosevkaTerm/IosevkaTerm-Regular.ttf
        - asset: fonts/IosevkaTerm/IosevkaTerm-Bold.ttf
          weight: 700
        - asset: fonts/IosevkaTerm/IosevkaTerm-Italic.ttf
          style: italic
        - asset: fonts/IosevkaTerm/IosevkaTerm-BoldItalic.ttf
          weight: 700
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
        - asset: fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: fonts/JetBrainsMono/JetBrainsMono-Italic.ttf
          style: italic
        - asset: fonts/JetBrainsMono/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    # Fira Code has no italics; the engine slants the upright faces.
    - family: Fira Code
      fonts:
        - asset: fonts/FiraCode/FiraCode-Regular.ttf
        - asset: fonts/FiraCode/FiraCode-Bold.ttf
          weight: 700
    - family: Maple Mono
      fonts:
        - asset: fonts/MapleMono/MapleMono-Regular.ttf
        - asset: fonts/MapleMono/MapleMono-Bold.ttf
          weight: 700
        - asset: fonts/MapleMono/MapleMono-Italic.ttf
          style: italic
        - asset: fonts/MapleMono/MapleMono-BoldItalic.ttf
          weight: 700
          style: italic
