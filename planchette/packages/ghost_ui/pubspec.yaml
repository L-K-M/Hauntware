name: ghost_ui
description: >-
  Shared Flutter UI for the Ghost app family: Planchette,
  Poltergeist, and Seance: family hues, contrast math, middle-ellipsis text,
  top toasts, menus, sidebars, and desktop/touch file-list rendering.
version: 1.9.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  # Rasterizes SVG badge images (badge_image.dart).
  flutter_svg: ^2.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
