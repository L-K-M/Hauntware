name: ghost_servers
description: >-
  Shared server surfaces for Seance, Poltergeist, Klabautermann and
  Planchette over seance_protocol and ghost_ui: the server list's
  sectioning rules, the status-dot vocabulary, the server editor, the
  host-key, keyboard-interactive and credential prompts, and the
  connection log and connection test views.
version: 1.9.4
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  # The server editor's appearance section: accent, badge and both pickers
  # (docs/design/ghost-servers-part2.md, F5a-2a).
  ghost_marks:
    path: ../ghost_marks
  # The sidebar dot vocabulary the status dots draw with, and the toast
  # helper the connection log views use.
  ghost_ui:
    path: ../ghost_ui
  # The server record types (ServerConfig, normalizeServerGroup,
  # serverGroupKey). The protocol package, never seance_core: Poltergeist
  # consumes this package and must not inherit dartssh2.
  seance_protocol:
    path: ../../../seance/packages/seance_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
