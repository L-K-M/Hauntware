name: ghost_servers
description: >-
  Shared server surfaces for Seance, Poltergeist and Klabautermann over
  seance_protocol and ghost_ui. Today it holds the server list's
  sectioning rules, the status-dot vocabulary and the host-key,
  keyboard-interactive and credential prompts; the connection log views
  follow in a later stage.
version: 1.9.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  # The sidebar dot vocabulary the status dots draw with, and the toast
  # helper the connection log views will use (a later stage of
  # docs/design/ghost-servers-part1.md).
  ghost_ui:
    path: ../ghost_ui
  # The server record types (ServerConfig, normalizeServerGroup,
  # serverGroupKey). The protocol package, never seance_core: Poltergeist
  # consumes this package and must not inherit dartssh2.
  seance_protocol:
    path: ../../../seance/packages/seance_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
