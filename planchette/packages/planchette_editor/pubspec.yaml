name: planchette_editor
description: Shared Flutter text editor for Planchette, Poltergeist, and Seance.
version: 1.9.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  # The bundled monospace fonts the document draws in.
  ghost_fonts:
    path: ../ghost_fonts
  ghost_ui:
    path: ../ghost_ui
  planchette_core:
    path: ../planchette_core

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
