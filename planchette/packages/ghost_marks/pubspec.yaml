name: ghost_marks
description: >-
  Shared server appearance for Seance and Poltergeist: server accents and
  tints, badges and accent bars, and the glyph and colour tables that let
  identical server records draw identical marks in both apps.
version: 1.9.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  # The server record types (ServerConfig, ServerMark, ServerIcon,
  # ServerColor). The protocol package, never seance_core: Poltergeist
  # consumes this package and must not inherit dartssh2.
  seance_protocol:
    path: ../../../seance/packages/seance_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
