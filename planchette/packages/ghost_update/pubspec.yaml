name: ghost_update
description: >-
  The apps' shared update-check session: the once-per-launch
  latest-release lookup's opt-out, banner and in-flight state, and on
  Android the user-chosen APK install through ghost_apk_update. The
  checker and release types come from seance_core; each app injects its
  repository, user agent and release asset name.
version: 1.9.4
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  # The Android in-place update the controller drives when the app
  # injects an updater.
  ghost_apk_update:
    path: ../ghost_apk_update
  # UpdateChecker, UpdateInfo and ReleaseAsset, the suite's one checker.
  # ghost_* packages otherwise never take seance_core (ghost_keystore
  # documents the dartssh2 hygiene reason); these types cannot be
  # redeclared and every consumer already resolves seance_core, so this
  # is the stated exception.
  seance_core:
    path: ../../../seance/packages/seance_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # MockClient for the request-shape test; test-only, nothing shipped.
  http: ^1.5.0
