name: ghost_licenses
description: >-
  The third-party notices Flutter's NOTICES cannot hold, for every Ghost
  app's licenses page: on Android, the Maven libraries the AboutLibraries
  Gradle plugin lists in the APK (res/raw/aboutlibraries.json).
version: 1.9.3
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ch.lkmc.ghost.licenses
        pluginClass: GhostLicensesPlugin
