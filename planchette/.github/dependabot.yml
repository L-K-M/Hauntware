version: 2
updates:
  # Dart packages (pubspec workspace).
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The Flutter editor package and app resolve outside the root workspace.
  - package-ecosystem: pub
    directory: /packages/planchette_editor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /app/planchette_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Workflow actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
