# Flatpak manifest. scripts/build-flatpak.sh extracts the release .deb into
# dist/flatpak/stage and builds from that — the bundle ships the same files
# the .deb installs, relaid under flatpak's /app prefix.
id: ch.lkmc.planchette
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: planchette
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU rendering for the Flutter embedder.
  - --device=dri
  # Folder workspaces and referenced keys use the same home access as the
  # suite's file client. SSH and catalog sync are opened on demand.
  - --filesystem=home
  - --share=network
  - --socket=ssh-auth
  - --talk-name=org.freedesktop.secrets
modules:
  - name: planchette
    buildsystem: simple
    sources:
      - type: dir
        path: ../dist/flatpak/stage
    build-commands:
      - rm -rf DEBIAN
      - "if [ -d usr ]; then cp -a usr/. /app/; else cp -a . /app/; fi"
