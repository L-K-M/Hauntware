name: planchette_app
description: A focused text editor built with the shared Planchette editor.
publish_to: none
version: 1.9.2+1090299

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  desktop_drop: 0.8.4
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  ghost_desktop:
    path: ../../packages/ghost_desktop
  ghost_fonts:
    path: ../../packages/ghost_fonts
  ghost_keystore:
    path: ../../packages/ghost_keystore
  ghost_servers:
    path: ../../packages/ghost_servers
  ghost_ui:
    path: ../../packages/ghost_ui
  path: 1.9.1
  path_provider: 2.1.6
  planchette_core:
    path: ../../packages/planchette_core
  planchette_editor:
    path: ../../packages/planchette_editor
  poltergeist_core:
    path: ../../../poltergeist/packages/poltergeist_core
  seance_core:
    path: ../../../seance/packages/seance_core
  window_manager: 0.5.2

dev_dependencies:
  file_selector_platform_interface: 2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  plugin_platform_interface: 2.1.8

flutter:
  uses-material-design: true
