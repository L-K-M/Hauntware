# Shared localization contract scanner (03 §3.5 F1b).
#
# A standalone pure-Dart tool package: no Flutter, no `package:test` in
# `lib/`. The Flutter apps consume it as a path dev dependency; its own
# tests run with `dart test` from this directory. `analyzer` is pinned to
# the version the Poltergeist app resolves so the scanner and the app
# parse with one analyzer.
name: l10n_contract
description: >-
  Scans a Flutter app for authored user-facing string literals that
  belong in ARB, honoring per-file technical-literal allowlists.
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: 14.1.0
  path: ^1.9.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
