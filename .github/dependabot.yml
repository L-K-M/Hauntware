# GitHub reads only this root file; the product subtrees' former
# .github/dependabot.yml files were never applied in the monorepo.
version: 2
updates:
  # Workflow actions (the root workflows are the only ones GitHub runs),
  # one grouped PR per run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
  # Android Gradle builds (AGP, Kotlin, wrapper) of the four apps, one
  # grouped PR per run. The standalone repos pointed this at their roots,
  # where no Gradle files exist (X-14).
  - package-ecosystem: gradle
    directories:
      - /seance/app/seance_app/android
      - /poltergeist/app/poltergeist_app/android
      - /klabautermann/app/klabautermann_app/android
      - /planchette/app/planchette_app/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns: ['*']
  # Every directory with its own pubspec.lock: the root release tooling,
  # the four workspaces, their apps, Planchette's editor and the
  # separately resolved shared packages. One grouped PR keeps the count
  # down. The M0 bench packages are left out: they reproduce the M0
  # measurements against an exact dartssh2 pin.
  #
  # Majors that need a migration the grouped PR cannot carry are held:
  # flutter_secure_storage 11 drops data written with v10's deprecated
  # options (keychain entries are user data), and sqlite3 3 loads SQLite
  # through a build hook that `dart compile exe` refuses. archive 4.6
  # stops reporting damaged data by default, which Poltergeist's
  # extraction of untrusted archives must audit first.
  - package-ecosystem: pub
    directories:
      - /
      - /tool/l10n_contract
      - /planchette
      - /planchette/packages/planchette_editor
      - /planchette/app/planchette_app
      - /seance
      - /seance/app/seance_app
      - /seance/packages/seance_terminal
      - /poltergeist
      - /poltergeist/app/poltergeist_app
      - /klabautermann
      - /klabautermann/app/klabautermann_app
      - /planchette/packages/ghost_*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: flutter_secure_storage
        update-types: ['version-update:semver-major']
      - dependency-name: sqlite3
        update-types: ['version-update:semver-major']
      - dependency-name: archive
        versions: ['>=4.6.0']
      - dependency-name: xml
        versions: ['>7.0.1']
    groups:
      pub:
        patterns: ['*']
  # The sync server's digest-pinned base images.
  - package-ecosystem: docker
    directory: /seance/packages/seance_sync_server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
