name: Runner diagnostics

on:
  push:
    branches: [ci/runner-recovery]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Mounts and Flatpak cache
        shell: bash
        run: |
          id
          printf 'Runner environment: %s\n' "$RUNNER_ENVIRONMENT"
          for path in /tmp "$HOME" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP"; do
            printf '\nPath: %s\n' "$path"
            findmnt -T "$path"
            stat -c 'device=%d mount=%m path=%n' "$path"
          done
          flatpak --version
          export FLATPAK_USER_DIR="$RUNNER_TOOL_CACHE/flatpak-user"
          printf '\nFlatpak installation: %s\n' "$FLATPAK_USER_DIR"
          flatpak list --user --columns=ref,size
          flatpak remotes --user --columns=name,url
          if [ -f "$FLATPAK_USER_DIR/repo/config" ]; then
            cat "$FLATPAK_USER_DIR/repo/config"
          fi
      - name: Compare buffered writes and durable flushes
        if: always()
        shell: bash
        run: |
          timeout 90s python3 -u - <<'PY'
          import os
          import tempfile
          import time

          for path in ("/tmp", os.environ["HOME"], os.environ["RUNNER_TOOL_CACHE"]):
              with tempfile.TemporaryDirectory(prefix="hauntware-io-probe-", dir=path) as work:
                  start = time.monotonic()
                  with open(os.path.join(work, "buffered"), "wb") as stream:
                      for _ in range(64):
                          stream.write(b"x" * 1024 * 1024)
                  print(f"{path}: buffered 64 MiB in {time.monotonic() - start:.3f}s", flush=True)

                  for sample in range(8):
                      start = time.monotonic()
                      with open(os.path.join(work, f"flush-{sample}"), "wb") as stream:
                          stream.write(b"x" * 4096)
                          stream.flush()
                          os.fsync(stream.fileno())
                      print(f"{path}: fsync {sample + 1}/8 in {time.monotonic() - start:.3f}s", flush=True)
          PY
      - name: Measure Flathub download
        if: always()
        shell: bash
        run: |
          curl --fail --location --max-time 60 --range 0-8388607 \
            --output /dev/null --silent --show-error \
            --write-out 'HTTP=%{http_code} bytes=%{size_download} bytes_per_second=%{speed_download} connect=%{time_connect}s first_byte=%{time_starttransfer}s total=%{time_total}s\n' \
            https://dl.flathub.org/repo/summary
      - name: Compare named and anonymous hard links
        if: always()
        shell: bash
        run: |
          timeout 90s python3 -u - <<'PY'
          import os
          import tempfile
          import time

          for location in ("/tmp", os.environ["RUNNER_TOOL_CACHE"]):
              for size in (4096, 16 * 1024 * 1024):
                  with tempfile.TemporaryDirectory(prefix="hauntware-link-probe-", dir=location) as work:
                      directory = os.open(work, os.O_RDONLY | os.O_DIRECTORY)
                      try:
                          named = os.path.join(work, "named")
                          with open(named, "wb") as stream:
                              stream.write(b"x" * size)
                          start = time.monotonic()
                          os.link(named, "named-link", dst_dir_fd=directory)
                          print(f"{location}: named link {size} bytes in {time.monotonic() - start:.6f}s", flush=True)

                          anonymous = os.open(work, os.O_TMPFILE | os.O_WRONLY, 0o600)
                          try:
                              os.write(anonymous, b"x" * size)
                              start = time.monotonic()
                              os.link(f"/proc/self/fd/{anonymous}", "anonymous-link", dst_dir_fd=directory)
                              print(f"{location}: anonymous link {size} bytes in {time.monotonic() - start:.6f}s", flush=True)
                          finally:
                              os.close(anonymous)
                      finally:
                          os.close(directory)
          PY
      - name: Inspect namespace policy
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          print("Kernel:", os.uname().release, flush=True)
          for name in (
              "/sys/module/zfs/version",
              "/proc/sys/user/max_user_namespaces",
              "/proc/sys/kernel/unprivileged_userns_clone",
              "/proc/sys/kernel/apparmor_restrict_unprivileged_userns",
              "/proc/self/attr/current",
          ):
              path = pathlib.Path(name)
              print(name, path.read_text().strip() if path.exists() else "absent", flush=True)
          for line in pathlib.Path("/proc/self/status").read_text().splitlines():
              if line.startswith(("Seccomp", "NoNewPrivs", "CapBnd")):
                  print(line, flush=True)
          for command in (
              ["unshare", "--user", "--map-root-user", "/bin/true"],
              ["sudo", "unshare", "--user", "--map-root-user", "/bin/true"],
          ):
              result = subprocess.run(command, text=True, capture_output=True, timeout=10)
              print(command, "status:", result.returncode, "stderr:", result.stderr.strip(), flush=True)
          PY
