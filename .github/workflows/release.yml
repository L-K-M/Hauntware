name: Release

# Tag a version (scripts/release.sh X.Y.Z --push) to test, build, and assemble
# Poltergeist's hidden release draft: the app client for every platform folder
# the repo carries — Android APK, Linux packages (.deb + AppImage, x64 —
# Flutter publishes no linux-arm64 host artifacts), macOS/Windows desktop
# bundles, and an unsigned iOS IPA. Poltergeist has no server component
# (bookmark backup rides Séance's sync server), so unlike Séance there are no
# server binaries or Docker images here. The desktop bundles are unsigned
# (macOS: ad-hoc), so first launch needs the usual unidentified-developer
# step (macOS: right-click ▸ Open; Windows: SmartScreen ▸ Run anyway), and
# the iOS IPA must be re-signed to install (AltStore / Sideloadly / Xcode
# with a free Apple ID). Tagging before app/poltergeist_app exists fails the
# client jobs by design — there is nothing to release yet.
# Manual dispatch accepts only an existing signed tag.

on:
  push:
    tags: ['v*']        # e.g. v0.2.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed release tag, e.g. v0.3.1"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate the release on the pure-Dart suite. A tag on a broken commit must
  # not publish a release. (The Flutter app's analyze+test and a per-platform
  # compile of every client run in CI on main/PRs, so the tagged commit is
  # already green there; the client jobs below still re-compile each
  # platform, which fails that platform's asset if it won't build.)
  test:
    name: Test (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get --enforce-lockfile
      - name: Resolve M0 benchmark harness
        if: hashFiles('tool/bench/pubspec.yaml') != ''
        working-directory: tool/bench
        run: dart pub get --enforce-lockfile
      - name: Verify dependency resolution preserves tagged source
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Resolve tagged source
        id: source
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify signed remote release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          dart run tool/release_publish/bin/publish_draft.dart
          verify-source
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ inputs.tag || github.ref_name }}"
          --commit "${{ steps.source.outputs.commit }}"
      - name: Verify release tag and versions
        run: >-
          dart run tool/release_version/bin/release_version.dart
          check-tag --tag "${{ inputs.tag || github.ref_name }}"
      - name: Analyze
        run: dart analyze $(ls -d packages/*)
      - name: Analyze release gate
        run: dart analyze tool/license_gate
      - name: Analyze release publisher
        run: dart analyze tool/release_publish
      - name: Analyze M0 benchmark harness
        working-directory: tool/bench
        run: dart analyze
      - name: Test
        run: |
          dirs=""
          for p in packages/*; do
            [ -d "$p/test" ] && dirs="$dirs $p"
          done
          if [ -z "$dirs" ]; then
            echo "no package has a test/ directory yet"; exit 1
          fi
          dart test $dirs
      - name: Test release gate
        run: dart test tool/license_gate/test
      - name: Test release publisher
        run: dart test tool/release_publish/test
      - name: Test M0 benchmark harness
        working-directory: tool/bench
        run: dart test test

  # The app, once per client platform. `flutter build` is host-locked
  # (linux/windows only build on their own OS, macos/ios only on a Mac) —
  # hence a matrix over runners. fail-fast stays off so one platform's
  # breakage doesn't cancel the others: completed jobs still preserve their
  # diagnostic artifacts. CI compiles the same matrix on main/PRs
  # (ci.yml `client` job — keep the two in step), so a tag should never be
  # the first time a client platform builds.
  client:
    name: Client (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # first run downloads the Flutter toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          # The APK should sign with a committed, deliberately public,
          # debug-grade keystore (Séance's ci-release.jks pattern — personal
          # tool, no Play Store) so each release's APK upgrades the installed
          # app in place instead of demanding an uninstall. The app scaffold
          # milestone sets this up; no signing secrets are needed either way.
          - os: ubuntu-latest
            target: android
            build: apk --release
            files: poltergeist-android.apk
          # The .deb and AppImage ride along with the plain bundle (three
          # assets); the .deb keeps its versioned Debian filename, hence the
          # glob. x64 only: Flutter publishes no linux-arm64 host artifacts
          # (releases_linux.json is x64-only), so an arm runner can't build it.
          - os: ubuntu-latest
            target: linux
            build: linux --release
            flavor: x64
            files: |
              poltergeist-linux-x64.tar.gz
              poltergeist_*.deb
              poltergeist-linux-x64.AppImage
          - os: macos-latest
            target: macos
            build: macos --release
            files: poltergeist-macos-universal.zip
          # No Apple Developer account: built unsigned (--no-codesign) and
          # shipped as an IPA for users who re-sign and sideload.
          - os: macos-latest
            target: ios
            build: ipa --release --no-codesign
            files: poltergeist-ios-unsigned.ipa
          - os: windows-latest
            target: windows
            build: windows --release
            files: poltergeist-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.source_commit }}
      # Pin the JDK so the Gradle build is deterministic rather than tracking
      # the runner's default; keep in step with the app's compileOptions.
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      # GTK toolchain for the Flutter Linux embedder, plus libsecret/jsoncpp
      # for flutter_secure_storage's keyring backend; imagemagick/file feed
      # scripts/package-linux.sh (icon resize, appimagetool).
      - name: Install Linux desktop toolchain
        if: startsWith(matrix.target, 'linux')
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libsecret-1-dev libjsoncpp-dev imagemagick file
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Resolve workspace
        run: dart pub get --enforce-lockfile
      - name: Resolve M0 benchmark harness
        working-directory: tool/bench
        run: dart pub get --enforce-lockfile
      - name: Resolve app dependencies
        working-directory: app/poltergeist_app
        run: flutter pub get --enforce-lockfile
      - name: Verify dependency resolution preserves tagged source
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      # If the committed project signs Release with a developer identity the
      # runner doesn't have (the scripts/build.sh local path), switch the
      # build to ad-hoc signing — the signing class the app is designed to
      # support (entitlements and keychain use chosen to work ad-hoc-signed,
      # per the Séance lesson). Harmless when the project already specifies
      # ad-hoc signing (sed simply matches nothing).
      - name: Switch macOS signing to ad-hoc (runner has no certificate)
        if: matrix.target == 'macos'
        run: |
          sed -i '' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/' \
            app/poltergeist_app/macos/Runner.xcodeproj/project.pbxproj
      - name: Verify pinned Séance licenses
        run: dart run tool/license_gate/bin/check.dart # SEANCE_LICENSE_GATE_V1
      - name: Build
        working-directory: app/poltergeist_app
        run: flutter build ${{ matrix.build }} --no-pub
      # Stage each platform's product under its release asset name: product +
      # platform, no version (the release page already carries the version) —
      # except the .deb, whose filename is Debian's versioned convention.
      # Poltergeist is ASCII, so unlike Séance no post-build bundle rename is
      # needed anywhere.
      - name: Package
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            android)
              cp app/poltergeist_app/build/app/outputs/flutter-apk/app-release.apk \
                 poltergeist-android.apk
              ;;
            linux)
              mv "$(ls -d app/poltergeist_app/build/linux/*/release/bundle)" \
                 "poltergeist-linux-${{ matrix.flavor }}"
              tar -czf "poltergeist-linux-${{ matrix.flavor }}.tar.gz" "poltergeist-linux-${{ matrix.flavor }}"
              # The mv above renamed the bundle out of Flutter's layout, so
              # point the packager at it explicitly (--bundle asks the ELF for
              # its arch).
              scripts/package-linux.sh --bundle "poltergeist-linux-${{ matrix.flavor }}" --output-dir .
              ;;
            macos)
              # ditto keeps the bundle's symlinks and metadata intact inside
              # the zip.
              cd app/poltergeist_app/build/macos/Build/Products/Release
              ditto -c -k --keepParent "$(ls -d *.app | head -1)" \
                "$GITHUB_WORKSPACE/poltergeist-macos-universal.zip"
              ;;
            ios)
              # Flutter stops after the unsigned archive. Zip its app under
              # Payload/ so the promised IPA exists for external re-signing.
              readonly ios_archive="app/poltergeist_app/build/ios/archive/Runner.xcarchive"
              readonly ios_app="$ios_archive/Products/Applications/Runner.app"
              test -d "$ios_app"
              mkdir Payload
              cp -R "$ios_app" Payload/
              zip -qry poltergeist-ios-unsigned.ipa Payload
              ;;
            windows)
              mv "$(ls -d app/poltergeist_app/build/windows/*/runner/Release)" poltergeist-windows-x64
              7z a -bd poltergeist-windows-x64.zip poltergeist-windows-x64
              ;;
          esac
      - name: Verify Android release package
        if: matrix.target == 'android'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          readonly expected_version="${RELEASE_TAG#v}"
          readonly build_tools="$(
            find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 \
              -type d -printf '%f\n' | sort -V | tail -1
          )"
          AAPT_BIN="$ANDROID_HOME/build-tools/$build_tools/aapt" \
          APKSIGNER_BIN="$ANDROID_HOME/build-tools/$build_tools/apksigner" \
            scripts/assert-android-release.sh \
              poltergeist-android.apk "$expected_version"
      - name: Transport packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  # One writer closes the full asset set before creating a hidden release.
  publish:
    name: Assemble draft release
    needs: [test, client]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.source_commit }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve publisher dependencies
        run: dart pub get --enforce-lockfile
      - name: Verify dependency resolution preserves tagged source
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false
      - name: Create closed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          dart run tool/release_publish/bin/publish_draft.dart
          publish
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ inputs.tag || github.ref_name }}"
          --commit "${{ needs.test.outputs.source_commit }}"
          --artifacts release-artifacts
          --output "$RUNNER_TEMP/release-publish"
