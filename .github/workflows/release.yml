      # platform, no version (the release page already carries the version) —
      # except the .deb, whose filename is Debian's versioned convention.
      # Poltergeist is ASCII, so unlike Séance no post-build bundle rename is
      # needed anywhere.
      - name: Package
        shell: bash
        run: |
          shopt -s nullglob
          case "${{ matrix.target }}" in
            android)
              cp poltergeist/app/poltergeist_app/build/app/outputs/flutter-apk/app-release.apk \
                 poltergeist-android.apk
              ;;
            linux)
              bundles=(poltergeist/app/poltergeist_app/build/linux/*/release/bundle)
              [[ ${#bundles[@]} -eq 1 ]] || { echo "expected one linux bundle, found ${#bundles[@]}" >&2; exit 1; }
              mv "${bundles[0]}" "poltergeist-linux-${{ matrix.flavor }}"
              tar -czf "poltergeist-linux-${{ matrix.flavor }}.tar.gz" "poltergeist-linux-${{ matrix.flavor }}"
              # The mv above renamed the bundle out of Flutter's layout, so
              # point the packager at it explicitly (--bundle asks the ELF for
              # its arch).
              poltergeist/scripts/package-linux.sh --bundle "poltergeist-linux-${{ matrix.flavor }}" --output-dir .
              # The .flatpak is the same .deb's payload staged under /app —
              # one packaging path, four assets.
              sudo apt-get update && sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils
              # Ubuntu 24.04 denies the unprivileged user namespaces
              # bubblewrap (flatpak's sandbox helper) builds in.
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true   # absent on kernels without the knob
              poltergeist/scripts/build-flatpak.sh "$(find . -maxdepth 1 -type f -name 'poltergeist_*.deb' -print -quit)"
              mv poltergeist/dist/poltergeist-linux-x64.flatpak .
              ;;
            macos)
              # ditto keeps the bundle's symlinks and metadata intact inside
              # the zip.
              cd poltergeist/app/poltergeist_app/build/macos/Build/Products/Release
              apps=(*.app)
              [[ ${#apps[@]} -eq 1 ]] || { echo "expected one .app, found ${#apps[@]}" >&2; exit 1; }
              ditto -c -k --keepParent "${apps[0]}" \
                "$GITHUB_WORKSPACE/poltergeist-macos-universal.zip"
              ;;
            ios)
              # An IPA is Payload/<app>.app zipped. `flutter build ipa
              # --no-codesign` stops at the unsigned .xcarchive and emits no
              # .ipa on its own, so zip the archive's app bundle explicitly
              # (D23's step) — unsigned; installing it means re-signing
              # (AltStore / Sideloadly / Xcode free account).
              app_dir="poltergeist/app/poltergeist_app/build/ios/archive/Runner.xcarchive/Products/Applications"
              apps=("$app_dir"/*.app)
              [[ ${#apps[@]} -eq 1 ]] || { echo "expected one .app under $app_dir, found ${#apps[@]}" >&2; exit 1; }
              mkdir Payload
              cp -R "${apps[0]}" Payload/
              zip -qry poltergeist-ios-unsigned.ipa Payload
              ;;
            windows)
              runners=(poltergeist/app/poltergeist_app/build/windows/*/runner/Release)
              [[ ${#runners[@]} -eq 1 ]] || { echo "expected one windows runner dir, found ${#runners[@]}" >&2; exit 1; }
              mv "${runners[0]}" poltergeist-windows-x64
              7z a -bd poltergeist-windows-x64.zip poltergeist-windows-x64
              ;;
          esac
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 (SHA-pinned)
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: >-
            ${{ startsWith(inputs.tag || github.ref_name, 'v0.') }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true

  # Container image to GitHub Container Registry. It pushes only after
  # EVERY build leg succeeded — an image must never publish for a
  # release whose client floor failed. Deployments build from source;
  # this image is the release artifact for everyone else.
  docker:
    name: Docker image
    needs:
      - test
      - server
      - client_planchette
      - client_seance
      - client_poltergeist
      - flatpak_planchette
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # Same dispatch-provenance pin as the test job: build the tag's own
      # commit whenever the tag already exists — the image bakes sources,
      # not just metadata.
      - name: Resolve the checkout ref
        id: checkout-ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/$RELEASE_TAG")
          case "$code" in
            200) echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT" ;;
            404) echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "tag ref lookup failed for $RELEASE_TAG (HTTP $code)" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA-pinned)
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (SHA-pinned)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 (SHA-pinned)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6 (SHA-pinned)
        with:
          # The image keeps the name the standalone Séance repo published
          # (0.2.0–0.9.2), so existing `docker pull` users keep updating.
          # The package must grant this repository Actions write access.
          images: ghcr.io/${{ github.repository_owner }}/seance
          # `value` feeds the semver parser the tag on workflow_dispatch runs
          # (where the git ref is a branch, not the tag); on tag pushes it is
          # the pushed tag itself, same as deriving from the ref.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (SHA-pinned)
        with:
          # Build context is the seance subtree root so its pub
          # workspace resolves (same contract as the Dockerfile header).
          context: seance/
          file: seance/packages/seance_sync_server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every release carries SHA-256 checksums for all assets — SHA256SUMS
  # beside the assets, the same sums in the notes — computed by CI after
  # all assets attach and the GHCR image is published (an integrity
  # channel, not an origin one). Runs only when every leg succeeded:
  # sums over a partial asset set would certify a broken release, and
  # the manifest floor check makes even a silent upload miss loud.
  sums:
    name: Checksums and publish
    needs:
      - server
      - client_planchette
      - client_seance
      - client_poltergeist
      - flatpak_planchette
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The floor manifest is versioned like the rest of the pipeline —
      # check out the tag's own commit for it.
      - name: Resolve the checkout ref
        id: checkout-ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/$RELEASE_TAG")
          case "$code" in
            200) echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT" ;;
            404) echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "tag ref lookup failed for $RELEASE_TAG (HTTP $code)" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA-pinned)
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}
      - name: Compute SHA256SUMS over the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          assets_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$REPO" \
            --dir "$assets_dir" --clobber
          # A re-run of this job downloads the previous attempt's
          # SHA256SUMS back with the assets; folded into the sums it
          # would list itself and the bijection check below would
          # fail on every retry. Drop it — the upload step below
          # --clobbers it back — so the floor check and the sums see
          # product assets only.
          rm -f "$assets_dir/SHA256SUMS"

          # Manifest floor: every entry in scripts/release-manifest.txt
          # must have a downloaded match — 25 product assets across the
          # three apps plus the sync-server tarballs. A missing leg's
          # asset can never sneak into a public release.
          floor_missing=()
          while IFS= read -r asset; do
            [[ -z "$asset" || "$asset" =~ ^# ]] && continue
            compgen -G "$assets_dir/$asset" >/dev/null \
              || floor_missing+=("$asset")
          done < scripts/release-manifest.txt
          if ((${#floor_missing[@]} > 0)); then
            echo "floor asset(s) missing from the release: ${floor_missing[*]}" >&2
            exit 1
          fi

          ( cd "$assets_dir" && sha256sum -- * ) > SHA256SUMS

          # The notes own the install-relevant labels beside the artifacts
          # (the desktop bundles are unsigned/ad-hoc, the iOS IPAs unsigned)
          # and the sums users verify downloads against.
          {
            cat <<'NOTES'
          **Planchette** — desktop bundles for Linux (.deb, AppImage,
          Flatpak, plain bundle, x64), macOS and Windows.
          **Séance** — Android APK (sideload; later suite APKs upgrade it
          in place), Linux packages (x64), macOS/Windows bundles, an
          unsigned iOS IPA, and the sync-server binaries (linux-x64,
          macos-arm64, windows-x64).
          **Poltergeist** — same client matrix as Séance (no server).
          Séance 0.9.2 and Poltergeist 1.0.1 and earlier used `com.lkm.*`
          app IDs. Suite builds use `ch.lkmc.*`: they install as new apps
          beside those versions and start without their data.
          Desktop bundles are unsigned; first launch needs the usual
          unidentified-developer step (macOS: right-click ▸ Open; Windows:
          SmartScreen ▸ Run anyway). The iOS IPAs must be re-signed to
          install (AltStore / Sideloadly / Xcode with a free Apple ID).
          The sync server also ships as the `ghcr.io/l-k-m/seance` image.

          `SHA256SUMS` ships beside the assets; the same sums follow below.

          ## SHA256 checksums

          NOTES
            cat SHA256SUMS
          } > RELEASE_NOTES.md

          # Never mutate a published release: a re-run after a
          # publish-step timeout would otherwise clobber SHA256SUMS and
          # the notes on the live release. The draft probe fails loud:
          # an errored view must not read as empty ("published").
          is_draft=$(gh release view "$RELEASE_TAG" --repo "$REPO" \
            --json isDraft --jq .isDraft) || exit 1
          if [ "$is_draft" = true ]; then
            gh release upload "$RELEASE_TAG" --repo "$REPO" SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --repo "$REPO" \
              --notes-file RELEASE_NOTES.md
          else
            echo "release already published; leaving assets and notes untouched" >&2
          fi
      # What the removed human ceremony did by hand, CI does here —
      # re-download the full set and check every digest against the
      # uploaded sums, catching corruption that appears between the two
      # downloads (storage rot, a bad mirror, in-transit corruption).
      # An asset corrupted at upload time is not caught: the sums
      # certify whatever the release serves. Build-side digests from
      # the client legs would close that gap.
      - name: Verify the uploaded asset set before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          gh release download "$RELEASE_TAG" --repo "$REPO" --clobber
          # Sums and files must be a bijection: sha256sum -c alone passes
          # on a truncated sums list, leaving assets unchecked. Compare
          # name sets, not counts -- a duplicate line balances the tally.
          listed=$(sed -E 's/^[0-9a-f]{64} [ *]?//' SHA256SUMS | awk 'NF' | sort)
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS \
            -printf '%f\n' | sort)
          if ! diff -u <(printf '%s\n' "$files") <(printf '%s\n' "$listed"); then
            echo "SHA256SUMS and the downloaded asset set are not a bijection" >&2
            exit 1
          fi
          sha256sum -c --strict SHA256SUMS
      # The publish itself: no human step, but only now that the floor
      # check passed, the image is pushed, and the sums are attached and
      # verified. Idempotent for re-runs: if a prior attempt already
      # flipped the release public (e.g. a timeout after a successful
      # call), there is nothing to do -- created-once is the guard job's
      # invariant, not this step's failure mode, and a spurious red here
      # would push a healthy published release down the delete-and-retag
      # path.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Fails loud: an errored probe reading as empty would take the
          # else branch and exit 0 -- a green run over an unpublished
          # draft.
          draft=$(gh release view "$RELEASE_TAG" --repo "$REPO" \
            --json isDraft --jq .isDraft) || exit 1
          if [ "$draft" = true ]; then
            # The rehearsal checklist's flag check, automated: a v0.* tag
            # must publish as a pre-release. Fail loud rather than publish
            # a mis-flagged release.
            case "$RELEASE_TAG" in v0.*) want=true ;; *) want=false ;; esac
            got=$(gh release view "$RELEASE_TAG" --repo "$REPO" \
              --json isPrerelease --jq .isPrerelease) || exit 1
            [ "$got" = "$want" ] || {
              echo "prerelease flag is '$got', expected '$want' for $RELEASE_TAG" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false
            # Post-publish probe: the edit returning 0 proves nothing —
            # re-read the flag so a silently no-op publish can never
            # report green over a release that is still a hidden draft.
            still=$(gh release view "$RELEASE_TAG" --repo "$REPO" \
              --json isDraft --jq .isDraft) || exit 1
            [ "$still" = false ] || {
              echo "publish call succeeded but $RELEASE_TAG is still a draft" >&2
              exit 1
            }
          else
            echo "release already published; nothing to do" >&2
          fi
