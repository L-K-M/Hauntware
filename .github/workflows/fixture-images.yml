name: Fixture images

# Publishes the frozen base of Poltergeist's modern sshd fixture
# (poltergeist/test/integration/sshd-modern-base): Alpine plus pinned
# OpenSSH and iproute2 packages. Alpine keeps only the newest build of
# each package, so installing those pins in every CI run broke whenever
# Alpine moved on. CI builds the fixture on this image by digest instead
# and never runs apk.
#
# A pull request that changes the base builds it without pushing. Once
# merged, run this workflow by hand on main and pin the digest from the
# run summary in sshd-modern/Dockerfile.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poltergeist/test/integration/sshd-modern-base/**'
      - '.github/workflows/fixture-images.yml'

permissions:
  contents: read

concurrency:
  group: fixture-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/l-k-m/poltergeist-sshd-modern-base
  CONTEXT: poltergeist/test/integration/sshd-modern-base
  # arm64 too, so the fixture still builds natively on Apple silicon.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  verify:
    name: Build the sshd-modern base image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA-pinned)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4 (SHA-pinned)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (SHA-pinned)
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (SHA-pinned)
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ env.PLATFORMS }}
          push: false

  publish:
    name: Publish the sshd-modern base image
    # Only a merged base is published, so every digest maps to main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job pushes to GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA-pinned)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4 (SHA-pinned)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (SHA-pinned)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 (SHA-pinned)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6 (SHA-pinned)
        with:
          images: ${{ env.IMAGE }}
          # The commit it was built from; CI pins the digest, not a tag.
          tags: type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (SHA-pinned)
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Report the digest to pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::build-push-action reported no digest: '$DIGEST'"
            exit 1
          }
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          {
            echo '### sshd-modern base'
            echo
            echo 'Pin in poltergeist/test/integration/sshd-modern/Dockerfile:'
            echo
            echo '```'
            echo "FROM $IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # CI and run.sh pull without logging in. A new GHCR package starts
      # private, and only its owner can make it public.
      - name: Check that the image pulls anonymously
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repository:pull" | jq -r .token)" ||
            token=''
          if ! curl -fsS -o /dev/null \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/$repository/manifests/$DIGEST"; then
            echo "::error::$IMAGE@$DIGEST does not pull anonymously. Make the package public in its GitHub package settings; the digest above stays valid."
            exit 1
          fi
