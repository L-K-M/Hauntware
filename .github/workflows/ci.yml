      # the runner's default; keep in step with the app's compileOptions.
      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      # GTK toolchain for the Flutter Linux embedder, plus libsecret/jsoncpp
      # for flutter_secure_storage's keyring backend. imagemagick/file: the
      # packaging step resizes the launcher icon and appimagetool needs `file`.
      - name: Install Linux desktop toolchain
        if: startsWith(matrix.target, 'linux')
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libsecret-1-dev libjsoncpp-dev imagemagick file xvfb xdotool
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # If the committed project signs Release with a developer identity the
      # runner doesn't have, switch to ad-hoc — CI must exercise the exact
      # signing path the release uses. Harmless when the project already
      # specifies ad-hoc signing (sed simply matches nothing).
      - name: Switch macOS signing to ad-hoc (runner has no certificate)
        if: matrix.target == 'macos'
        run: |
          sed -i '' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/' \
            poltergeist/app/poltergeist_app/macos/Runner.xcodeproj/project.pbxproj
      - name: Resolve app dependencies
        working-directory: poltergeist/app/poltergeist_app
        run: flutter pub get
      - name: Build
        working-directory: poltergeist/app/poltergeist_app
        run: flutter build ${{ matrix.build }}
      # Native-asset frameworks must not land on embedded ones, and the app
      # must pass the codesign check scripts/build.sh --install runs.
      - name: Verify macOS app bundle
        if: matrix.target == 'macos'
        working-directory: poltergeist/app/poltergeist_app
        run: bash "$GITHUB_WORKSPACE/scripts/verify-macos-app.sh"
      - name: Verify native macOS keyboard compatibility
        if: matrix.target == 'macos'
        working-directory: poltergeist
        run: bash scripts/test-macos-keyboard.sh
      # A release-only startup failure leaves a running app without its UI;
      # unit tests run with asserts on and never see one. The window shows
      # after Dart mounts the app (macOS, where File is a Dart menu) or on
      # the first frame (Linux, Windows). The macOS login keychain lives
      # under the real home, so that launch keeps it.
      - name: Release app launch (macOS)
        if: matrix.target == 'macos'
        working-directory: poltergeist/app/poltergeist_app
        run: python3 "$GITHUB_WORKSPACE/scripts/test-desktop-launch.py" build/macos/Build/Products/Release/Poltergeist.app --menu File --home user
      - name: Release app launch (Linux)
        if: matrix.target == 'linux'
        working-directory: poltergeist/app/poltergeist_app
        run: xvfb-run -a python3 "$GITHUB_WORKSPACE/scripts/test-desktop-launch.py" build/linux/${{ matrix.flavor }}/release/bundle/poltergeist
      - name: Release app launch (Windows)
        if: matrix.target == 'windows'
        working-directory: poltergeist/app/poltergeist_app
        shell: bash
        run: python "$GITHUB_WORKSPACE/scripts/test-desktop-launch.py" build/windows/x64/runner/Release/poltergeist_app.exe
      # Prove Gradle consumed the synchronized pubspec code in the real APK.
      - name: Verify Android version code
        if: matrix.target == 'android'
        working-directory: poltergeist/app/poltergeist_app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/verify-android-version.sh"
      # Exercise the same packaging the release workflow ships. Do not upload
      # binaries from ordinary CI: a build may embed code whose grants to
      # recipients are not yet audited for distribution.
      - name: Package Linux artifacts (.deb + AppImage)
        if: startsWith(matrix.target, 'linux')
        working-directory: poltergeist
        run: scripts/package-linux.sh --output-dir dist-packages
      # Repack the same .deb as a Flatpak bundle; no upload — ordinary CI
