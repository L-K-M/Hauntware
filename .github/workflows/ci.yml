          flutter test --no-pub
      - name: Shared editor
        working-directory: planchette/packages/planchette_editor
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Shared desktop window lifecycle
        working-directory: planchette/packages/ghost_desktop
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Shared server appearance
        working-directory: planchette/packages/ghost_marks
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Shared theme model
        working-directory: planchette/packages/ghost_theme
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Shared server surfaces
        working-directory: planchette/packages/ghost_servers
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Shared keystore entries
        working-directory: planchette/packages/ghost_keystore
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Shared Android in-app update
        working-directory: planchette/packages/ghost_apk_update
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Standalone app
        working-directory: planchette/app/planchette_app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      # After the tests, so a formatting slip never hides their results.
      - name: Format
        run: >-
          dart format --set-exit-if-changed --output=none
          planchette/packages/planchette_core planchette/packages/planchette_editor
          planchette/packages/ghost_ui planchette/packages/ghost_fonts
          planchette/packages/ghost_desktop
          planchette/packages/ghost_marks planchette/packages/ghost_theme
          planchette/packages/ghost_servers planchette/packages/ghost_keystore
          planchette/packages/ghost_apk_update planchette/app/planchette_app

