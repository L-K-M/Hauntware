  # Klabautermann's legs copy poltergeist_client and add the two native
  # macOS fixtures of seance_client (docs/design/klabautermann, 04
  # §12.1). Like the siblings they build on every PR without a path
  # filter (owner decision 15, D37). No release leg ships these builds
  # until client_klabautermann joins release.yml at M4 (decision 16);
  # keep the two in step from then on.
  klabautermann_client:
    name: Klabautermann client (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # first run downloads the Flutter toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            build: apk --release
          # x64 only, for the reason poltergeist_client gives: Flutter
          # publishes no linux-arm64 host artifacts.
          - os: ubuntu-latest
            target: linux
            build: linux --release
            flavor: x64
          - os: macos-latest
            target: macos
            build: macos --release
          - os: macos-latest
            target: ios
            # The unsigned .xcarchive the M4 release leg will zip, as
            # Poltergeist's does.
            build: ipa --release --no-codesign
          - os: windows-latest
            target: windows
            build: windows --release
    steps:
      - uses: actions/checkout@v7
      # Pin the JDK so the Gradle build is deterministic rather than tracking
      # the runner's default; keep in step with the app's compileOptions.
      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      # GTK toolchain for the Flutter Linux embedder, plus libsecret/jsoncpp
      # for flutter_secure_storage's keyring backend (ghost_keystore);
      # imagemagick and file feed scripts/package-linux.sh (icon resize,
      # appimagetool), xvfb and xdotool the launch check.
      - name: Install Linux desktop toolchain
        if: startsWith(matrix.target, 'linux')
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libsecret-1-dev libjsoncpp-dev imagemagick file xvfb xdotool
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The committed project already signs ad-hoc, so today this step
      # (Poltergeist's) only switches the signing style to manual; it keeps
      # CI on the release leg's signing path if a developer identity is
      # ever committed.
      - name: Switch macOS signing to ad-hoc (runner has no certificate)
        if: matrix.target == 'macos'
        run: |
          sed -i '' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/' \
            klabautermann/app/klabautermann_app/macos/Runner.xcodeproj/project.pbxproj
      - name: Resolve app dependencies
        working-directory: klabautermann/app/klabautermann_app
        run: flutter pub get
      - name: Build
        working-directory: klabautermann/app/klabautermann_app
        run: flutter build ${{ matrix.build }}
      # Native-asset frameworks must not land on embedded ones, and the app
      # must pass the codesign check scripts/build.sh --install runs.
      - name: Verify macOS app bundle
        if: matrix.target == 'macos'
        working-directory: klabautermann/app/klabautermann_app
        run: bash "$GITHUB_WORKSPACE/scripts/verify-macos-app.sh"
      # Séance's fixtures, compiled against the runner's copy of its
      # controller (klabautermann/docs/SHARED.md) and the cached release
      # engine the build above downloaded.
      - name: Test native accessibility lifecycle
        if: matrix.target == 'macos'
        working-directory: klabautermann
        run: scripts/test-macos-accessibility.sh
      - name: Test native keyboard modifiers
        if: matrix.target == 'macos'
        working-directory: klabautermann
        run: scripts/test-macos-keyboard.sh
      # A release-only startup failure leaves a running app without its UI;
      # unit tests run with asserts on and never see one. The window shows
      # after Dart places it (macOS, where File is a Dart menu) or on the
      # first frame (Linux, Windows). Nothing reads the keychain yet, so
      # every launch gets the script's throwaway home, whose HOME also
      # gives File its ssh_config import entry.
      - name: Release app launch (macOS)
        if: matrix.target == 'macos'
        working-directory: klabautermann/app/klabautermann_app
        run: python3 "$GITHUB_WORKSPACE/scripts/test-desktop-launch.py" build/macos/Build/Products/Release/Klabautermann.app --menu File
      - name: Release app launch (Linux)
        if: matrix.target == 'linux'
        working-directory: klabautermann/app/klabautermann_app
        run: xvfb-run -a python3 "$GITHUB_WORKSPACE/scripts/test-desktop-launch.py" build/linux/${{ matrix.flavor }}/release/bundle/klabautermann
      - name: Release app launch (Windows)
        if: matrix.target == 'windows'
        working-directory: klabautermann/app/klabautermann_app
        shell: bash
        run: python "$GITHUB_WORKSPACE/scripts/test-desktop-launch.py" build/windows/x64/runner/Release/klabautermann.exe
      # Prove Gradle consumed the synchronized pubspec code in the real APK.
      - name: Verify Android version code
        if: matrix.target == 'android'
        working-directory: klabautermann/app/klabautermann_app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/verify-android-version.sh"
      # The packaging the M4 release leg will ship. No upload: ordinary CI
      # does not publish binaries (see poltergeist_client).
      - name: Package Linux artifacts (.deb + AppImage)
        if: startsWith(matrix.target, 'linux')
        working-directory: klabautermann
        run: scripts/package-linux.sh --output-dir dist-packages
      # Repack the same .deb as a Flatpak bundle; no upload either.
      - name: Flatpak bundle (build check only)
        if: startsWith(matrix.target, 'linux')
        working-directory: klabautermann
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils
          # Ubuntu 24.04 denies the unprivileged user namespaces bubblewrap
          # (flatpak's sandbox helper) builds in.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true   # absent on kernels without the knob
          deb="$(find dist-packages -maxdepth 1 -type f -name 'klabautermann_*.deb' -print -quit)"
          [ -n "$deb" ] || { echo "::error::no klabautermann_*.deb in dist-packages" >&2; exit 1; }
          scripts/build-flatpak.sh "$deb"

  # ---- Séance sync server image -----------------------------------------
  docker:
    name: Sync server Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Build context is the seance subtree root so its pub workspace
      # resolves (same contract as the Dockerfile header).
      - name: Build image
        run: docker build -f seance/packages/seance_sync_server/Dockerfile -t seance-sync:ci seance/
