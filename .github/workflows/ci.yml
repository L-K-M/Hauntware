name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p4_diagnostic:
    name: P4 pane cold-build diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Linux desktop and headless display
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev libjsoncpp-dev xvfb libegl1 libgles2 libgl1-mesa-dri
      - name: Resolve dependencies
        working-directory: app/poltergeist_app
        run: flutter pub get
      - name: Compare pane cold-build variants
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d /tmp/poltergeist-p4-diagnostic.XXXXXX)
          trap 'rm -rf -- "$fixture_root"' EXIT
          mkdir -p "$fixture_root/entries-10000" "$GITHUB_WORKSPACE/p4-diagnostic"
          seq -f "$fixture_root/entries-10000/entry-%06g" 10000 | xargs -n 5000 touch
          cpu_model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          cd app/poltergeist_app
          repetition=0
          for variant in baseline three-row-cache no-keep-alives reuse-pane-view no-row-repaint-boundaries combined-list-options baseline; do
            repetition=$((repetition + 1))
            three_row_cache=false
            no_keep_alives=false
            reuse_pane_view=false
            no_row_repaint_boundaries=false
            case "$variant" in
              three-row-cache) three_row_cache=true ;;
              no-keep-alives) no_keep_alives=true ;;
              reuse-pane-view) reuse_pane_view=true ;;
              no-row-repaint-boundaries) no_row_repaint_boundaries=true ;;
              combined-list-options)
                three_row_cache=true
                no_keep_alives=true
                no_row_repaint_boundaries=true
                ;;
            esac
            label="$repetition-$variant"
            xvfb-run -a flutter drive --driver=test_driver/integration_test.dart --target=integration_test/perf/temporary_p4_list_test.dart --device-id linux --profile \
              "--dart-define=POLTERGEIST_BENCH_FIXTURE_ROOT=$fixture_root" \
              "--dart-define=POLTERGEIST_BENCH_OUTPUT=$GITHUB_WORKSPACE/p4-diagnostic/$label.json" \
              "--dart-define=POLTERGEIST_BENCH_RUNNER_IMAGE=$ImageOS@$ImageVersion" \
              "--dart-define=POLTERGEIST_BENCH_CPU_MODEL=$cpu_model" \
              --dart-define=POLTERGEIST_BENCH_FLUTTER_VERSION=3.47.2 \
              --dart-define=P4_LIST_DIAGNOSTIC_MODE=normal \
              --dart-define=P4_LIST_WORKER=false \
              --dart-define=P4_ACTIVATION_DELAY_MS=300 \
              "--dart-define=P4_THREE_ROW_CACHE=$three_row_cache" \
              "--dart-define=P4_NO_KEEP_ALIVES=$no_keep_alives" \
              "--dart-define=P4_REUSE_PANE_VIEW=$reuse_pane_view" \
              "--dart-define=P4_NO_ROW_REPAINT_BOUNDARIES=$no_row_repaint_boundaries" \
              2>&1 | tee "$GITHUB_WORKSPACE/p4-diagnostic/$label.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p4-list-diagnostic
          path: p4-diagnostic
