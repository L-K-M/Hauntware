name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p4_diagnostic:
    name: P4 production-path diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - name: Resolve workspace
        run: dart pub get
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Linux desktop and headless display
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev libjsoncpp-dev xvfb libegl1 libgles2 libgl1-mesa-dri
      - name: Resolve dependencies
        working-directory: app/poltergeist_app
        run: flutter pub get
      - name: Compare production-path pane variants
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d /tmp/poltergeist-bench-b.XXXXXX)
          trap 'rm -rf -- "$fixture_root"' EXIT
          mkdir -p "$fixture_root/entries-10000" "$fixture_root/entries-100000" "$GITHUB_WORKSPACE/p4-diagnostic"
          seq -f "$fixture_root/entries-10000/entry-%06g" 10000 | xargs -n 5000 touch
          seq -f "$fixture_root/entries-100000/entry-%06g" 100000 | xargs -n 5000 touch
          cpu_model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          lscpu
          cat /proc/loadavg
          cd app/poltergeist_app
          run_scenario() {
            local label="$1" target="$2" viewport_only="$3" one_row="$4" cache_date_formats="$5"
            xvfb-run -a flutter drive --driver=test_driver/integration_test.dart --target="integration_test/perf/$target" --device-id linux --profile \
              "--dart-define=POLTERGEIST_BENCH_FIXTURE_ROOT=$fixture_root" \
              "--dart-define=POLTERGEIST_BENCH_OUTPUT=$GITHUB_WORKSPACE/p4-diagnostic/$label.json" \
              "--dart-define=POLTERGEIST_BENCH_RUNNER_IMAGE=ubuntu-latest@$ImageVersion" \
              "--dart-define=POLTERGEIST_BENCH_CPU_MODEL=$cpu_model" \
              --dart-define=POLTERGEIST_BENCH_FLUTTER_VERSION=3.47.2 \
              "--dart-define=P4_VIEWPORT_ONLY_CACHE=$viewport_only" \
              "--dart-define=P4_ONE_ROW_CACHE=$one_row" \
              "--dart-define=P4_CACHE_DATE_FORMATS=$cache_date_formats" \
              2>&1 | tee "$GITHUB_WORKSPACE/p4-diagnostic/$label.log"
          }
          run_scenario prelude-p1 p1_first_paint_test.dart false false false
          run_scenario prelude-p2 p2_first_paint_test.dart false false false
          repetition=0
          for variant in baseline viewport-only viewport-and-date-cache one-row-and-date-cache baseline; do
            repetition=$((repetition + 1))
            viewport_only=false
            one_row=false
            cache_date_formats=false
            case "$variant" in
              viewport-only) viewport_only=true ;;
              viewport-and-date-cache)
                viewport_only=true
                cache_date_formats=true
                ;;
              one-row-and-date-cache)
                one_row=true
                cache_date_formats=true
                ;;
            esac
            run_scenario "$repetition-$variant" p4_tab_switch_test.dart "$viewport_only" "$one_row" "$cache_date_formats"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p4-production-path-diagnostic
          path: p4-diagnostic
