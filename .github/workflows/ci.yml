name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/planchette_core
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  editor:
    name: Editor and app (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format
        run: >-
          dart format --set-exit-if-changed
          packages/planchette_core packages/planchette_editor
          app/planchette_app
      - name: Shared editor
        working-directory: packages/planchette_editor
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Standalone app
        working-directory: app/planchette_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v7
      - name: Linux toolchain
        if: matrix.target == 'linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          dpkg-dev file binutils imagemagick
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve app
        working-directory: app/planchette_app
        run: flutter pub get
      - name: Build
        working-directory: app/planchette_app
        run: flutter build ${{ matrix.target }} --release
      - name: Native-platform app regressions
        if: matrix.target != 'linux'
        working-directory: app/planchette_app
        run: flutter test --no-pub
      - name: Linux packages
        if: matrix.target == 'linux'
        run: scripts/package-linux.sh --appimage=required
      - name: Native keyboard modifiers
        if: matrix.target == 'macos'
        run: scripts/test-macos-keyboard.sh
      - name: Native accessibility lifecycle
        if: matrix.target == 'macos'
        run: scripts/test-macos-accessibility.sh
