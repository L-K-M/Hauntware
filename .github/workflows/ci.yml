name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p4_diagnostic:
    name: P4 listing contention diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Linux desktop and headless display
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev libjsoncpp-dev xvfb libegl1 libgles2 libgl1-mesa-dri
      - name: Resolve dependencies
        working-directory: app/poltergeist_app
        run: flutter pub get
      - name: Compare per-file messages and a listing worker
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d /tmp/poltergeist-p4-diagnostic.XXXXXX)
          trap 'rm -rf -- "$fixture_root"' EXIT
          mkdir -p "$fixture_root/entries-10000" "$GITHUB_WORKSPACE/p4-diagnostic"
          seq -f "$fixture_root/entries-10000/entry-%06g" 10000 | xargs -n 5000 touch
          cpu_model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          cd app/poltergeist_app
          repetition=0
          for worker in false true true false; do
            repetition=$((repetition + 1))
            xvfb-run -a flutter drive --driver=test_driver/integration_test.dart --target=integration_test/perf/temporary_p4_list_test.dart --device-id linux --profile \
              "--dart-define=POLTERGEIST_BENCH_FIXTURE_ROOT=$fixture_root" \
              "--dart-define=POLTERGEIST_BENCH_OUTPUT=$GITHUB_WORKSPACE/p4-diagnostic/$repetition-worker-$worker.json" \
              "--dart-define=POLTERGEIST_BENCH_RUNNER_IMAGE=$ImageOS@$ImageVersion" \
              "--dart-define=POLTERGEIST_BENCH_CPU_MODEL=$cpu_model" \
              --dart-define=POLTERGEIST_BENCH_FLUTTER_VERSION=3.47.2 \
              --dart-define=P4_LIST_DIAGNOSTIC_MODE=normal \
              "--dart-define=P4_LIST_WORKER=$worker" \
              2>&1 | tee "$GITHUB_WORKSPACE/p4-diagnostic/$repetition-worker-$worker.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p4-list-diagnostic
          path: p4-diagnostic
