name: seance_sync_server
description: >-
  Séance sync server: a single static binary that stores end-to-end encrypted
  record blobs and resolves conflicts by last-write-wins. Knows nothing it can
  decrypt. Ships as a scratch Docker image.
version: 1.9.4
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  seance_protocol:
    path: ../seance_protocol
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  # Held on 2.x: 3.x loads SQLite through a build hook, which
  # `dart compile exe` (the Dockerfile and the release server binaries)
  # refuses, and it drops the runtime loader override that lets the slim
  # image use libsqlite3.so.0. Moving needs `dart build cli` and a new
  # artifact layout.
  sqlite3: ^2.4.0
  args: ^2.5.0

dev_dependencies:
  # Pins the reference client's hash (kInboxReferenceClientSha256).
  crypto: ^3.0.8
  lints: ^6.1.0
  test: ^1.33.0
  http: ^1.2.0
  # Dev-only: exercises the real client (HttpSyncClient + SyncEngine) against a
  # running server in the integration test. Not a runtime dependency.
  seance_core:
    path: ../seance_core
