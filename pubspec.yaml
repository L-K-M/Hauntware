# Hauntware suite manifest.
#
# This is the one versioned artifact at the repository root: the shared
# lkm-release engine reads the suite version from here (it is the first
# entry in RELEASE_PUBSPECS) and keeps every owned package/app pubspec in
# lockstep through scripts/release.sh.
#
# It is deliberately NOT a pub workspace: each project keeps its own
# pure-Dart workspace resolved per subtree (planchette/, seance/,
# poltergeist/), and the Flutter apps stay outside those workspaces.
# The dev dependencies below exist so tool/release_version and the suite
# guards in tool/ can resolve `package:analyzer`, `package:package_config`,
# `package:path`, `package:yaml` and `package:test` against this root —
# run `dart pub get` here before using the tools or their tests.
# `analyzer` and `package_config` pin the versions the moved guard suites
# were developed against (matching poltergeist/pubspec.yaml's pins).
name: hauntware
publish_to: none
version: 1.9.3

environment:
  sdk: ^3.12.0

dev_dependencies:
  analyzer: 14.1.0
  lints: ^5.0.0
  path: ^1.9.1
  package_config: 3.0.0
  test: ^1.25.0
  yaml: ^3.1.4
