# `dart test` reads the dart_test.yaml of the directory it runs from, not
# those of the packages it is given. CI and scripts/test.sh run every
# suite from here, so this repeats what packages/*/dart_test.yaml declare.
tags:
  # Real-shell tests: dash and bash where installed.
  shell:
  # Engine tests against the sshd fixture, which run.sh starts; skipped
  # without it (03 §11.3, D53).
  integration:
  # Engine tests against the runner VM's systemd, which runner_vm.sh
  # starts from run.sh on a GitHub-hosted runner; skipped without it.
  runner-vm:
  # The soak and 03 §11.4's budgets against the sshd fixture, which
  # run.sh's soak block runs alone; skipped without it.
  soak:
# A wedged shell test (an unread pipe or a hung child shell) would pin the
# VM; cap every test instead.
timeout: 60s
