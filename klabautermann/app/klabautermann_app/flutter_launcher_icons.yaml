# Launcher icons for every platform, generated from the one vector-of-truth
# master image (media-sources/klabautermann-icon.png, 1254x1254). The
# generated icon files are committed with the platform folders; re-run after
# changing the master:
#
#   cd app/klabautermann_app && dart run flutter_launcher_icons
#
# Linux has no generator here: on installed systems the desktop icon comes
# from the hicolor sizes the packaging step generates out of this same
# master image (a later milestone adds it, as in the siblings).
flutter_launcher_icons:
  image_path: "../../media-sources/klabautermann-icon.png"
  android: true
  # Adaptive icons (API 26+) crop the foreground to the safe zone; the dark
  # backdrop matches the image's own near-black edge so the crop blends in.
  adaptive_icon_background: "#110b06"
  adaptive_icon_foreground: "../../media-sources/klabautermann-icon.png"
  ios: true
  # iOS rejects app icons with an alpha channel.
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "../../media-sources/klabautermann-icon.png"
  windows:
    generate: true
    image_path: "../../media-sources/klabautermann-icon.png"
    icon_size: 256
