name: klabautermann_app
description: Klabautermann fleet manager for servers and Docker.
publish_to: none
version: 1.9.0+1090099

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # gen-l10n's generated localizations use intl primitives.
  intl: 0.20.3
  # The engine-isolate protocol and client the app composes over (03 D18).
  klabautermann_core:
    path: ../../packages/klabautermann_core
  # Shared sidebar kit, family palette and theme tokens (03 §10.2, §10.9).
  ghost_ui:
    path: ../../../planchette/packages/ghost_ui
  # The theme model and builder: the brand style, presets and appearance
  # value the light and dark themes are built from (03 D9, §10.9).
  ghost_theme:
    path: ../../../planchette/packages/ghost_theme
  # getApplicationSupportDirectory() for settings.json (03 §4.10); pinned
  # to Poltergeist's version.
  path_provider: 2.1.6
  # The desktop settings window's link engine (03 §10.2, D32). Brings the
  # window_manager and screen_retriever plugins with it.
  ghost_desktop:
    path: ../../../planchette/packages/ghost_desktop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # Launcher icons (config in flutter_launcher_icons.yaml):
  # dart run flutter_launcher_icons
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  generate: true
