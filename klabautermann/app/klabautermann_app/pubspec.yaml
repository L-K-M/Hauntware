name: klabautermann_app
description: Klabautermann fleet manager for servers and Docker.
publish_to: none
version: 1.9.2+1090299

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The OS-keystore plugin behind ghost_keystore's MasterKeyManager, pinned
  # to Poltergeist's version so the plugin's native code and default
  # options match the sibling's.
  flutter_secure_storage: 10.3.1
  # LOG-10's export (M5 plan P15): the save dialog and the share sheet.
  # Not the siblings' file_picker 11.0.3 and share_plus 12.0.2: both need
  # win32 5, which package_info_plus 10.2.2 above rules out for the same
  # flutter_secure_storage_windows reason; these are the first releases
  # on win32 6.
  file_picker: 13.1.0
  share_plus: 13.3.1
  # ALR-01's system notifications for raised alerts (03 §7.19; BSD-3,
  # approved by the owner on 2026-10-10, D10).
  flutter_local_notifications: 22.3.3
  # gen-l10n's generated localizations use intl primitives.
  intl: 0.20.3
  # The engine-isolate protocol and client the app composes over (03 D18).
  klabautermann_core:
    path: ../../packages/klabautermann_core
  # Shared sidebar kit, family palette and theme tokens (03 §10.2, §10.9).
  ghost_ui:
    path: ../../../planchette/packages/ghost_ui
  # The shared status-dot vocabulary the fleet rows resolve through (03
  # §3.2's APP -> GS edge, F4): ghostServerIndicator and ghostStatusDot,
  # fed by the app's adapter in lib/ui/fleet_row_state.dart. Its
  # seance_protocol dependency is already transitive through
  # klabautermann_core; the app still never imports it
  # (test/architecture_contract_test.dart).
  ghost_servers:
    path: ../../../planchette/packages/ghost_servers
  # The server editor's mark and colour pickers take their words from
  # the app (lib/ui/server_editor_strings.dart); ghost_servers brings the
  # package already.
  ghost_marks:
    path: ../../../planchette/packages/ghost_marks
  # The container shell (03 §7.13, CTX-07): Séance's xterm engine,
  # keyboard bar, appearance mapping and paste policy, reached only
  # through its barrel (test/architecture_contract_test.dart).
  seance_terminal:
    path: ../../../seance/packages/seance_terminal
  # The theme model and builder: the brand style, presets and appearance
  # value the light and dark themes are built from (03 D9, §10.9).
  ghost_theme:
    path: ../../../planchette/packages/ghost_theme
  # The vault master key and the sync token in the OS keystore (03 §4.5),
  # which the app answers for the engine (D62): the plugin's channels
  # answer only this isolate.
  ghost_keystore:
    path: ../../../planchette/packages/ghost_keystore
  # The log viewer's text search (LOG-05, 03 D56): Planchette's find-bar
  # search with its case folding.
  planchette_core:
    path: ../../../planchette/packages/planchette_core
  # The stack file view (STK-04, 03 §7.16): Planchette's shared editor
  # with editing locked, as Poltergeist's compare view shows a file.
  planchette_editor:
    path: ../../../planchette/packages/planchette_editor
  # getApplicationSupportDirectory() for settings.json (03 §4.10); pinned
  # to Poltergeist's version.
  path_provider: 2.1.6
  # The desktop settings window's link engine, the main window's state
  # lifecycle and the macOS toolbar band channel (03 §10.2, D32). Brings
  # the window_manager and screen_retriever plugins with it.
  ghost_desktop:
    path: ../../../planchette/packages/ghost_desktop
  # The bundled monospace fonts behind the siblings' code stack.
  ghost_fonts:
    path: ../../../planchette/packages/ghost_fonts
  # The macOS integrated titlebar: a transparent titlebar over full-size
  # content with an empty unified toolbar (lib/services/macos_titlebar.dart).
  # Pinned to the version Séance and Poltergeist run, whose titlebar this
  # one follows.
  macos_window_utils: 1.9.1
  # File > Quit on Linux and Windows asks the main window to close, the
  # path its close button takes (lib/ui/menus/app_commands.dart). Already
  # resolved through ghost_desktop; pinned to that version, as Poltergeist
  # pins it.
  window_manager: 0.5.2
  # The running build's version for the About dialog (lib/services/
  # app_version.dart), read once by the app's isolate. Not Poltergeist's
  # 8.3.1: that one needs win32 5, which would take
  # flutter_secure_storage_windows back from 4.2.2 to 4.1.0, before its
  # fixes for concurrent reads and writes losing data.
  package_info_plus: 10.2.2
  # Hand-offs to Séance and Poltergeist (X-03, X-04, X-10): opens their
  # links and probes for a handler. Pinned to the version Poltergeist runs.
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Spike S5's frame-timing test (integration_test/, 03 §11.4), run by
  # scripts/bench-frame-timing.sh through `flutter drive`; test-only.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: 6.0.0
  # The suite's shared localization contract scanner (03 §3.5 F1b, D35),
  # as Poltergeist consumes it; test-only, nothing shipped.
  l10n_contract:
    path: ../../../tool/l10n_contract
  # The jobs tests build the rows a CronResult carries with the engine's
  # own mergeJobs, as those rows have no public constructor. lib/ reaches
  # host types only through klabautermann_core's barrel (03 §3.2).
  klabautermann_host:
    path: ../../packages/klabautermann_host
  # Launcher icons (config in flutter_launcher_icons.yaml):
  # dart run flutter_launcher_icons
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  generate: true
