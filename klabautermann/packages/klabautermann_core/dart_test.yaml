# Declares the `shell` tag of the real-shell tests (the sampler session's
# and the capture tool's runs against dash and bash), the `integration`
# tag of the sshd fixture tests, the `runner-vm` tag of the runner VM's
# systemd tests, the `runner-vm-s4` tag of spike S4's cases there, the
# `runner-vm-s6` tag of spike S6's, the
# `soak` tag of the fixture soak, the `docker` tag of the Docker host's
# tests, which carry `integration` too, and the `inventory` tag of the
# host write inventory's session, and the `sync` tag of the two-device
# convergence suite, which carries `integration` too. package:test
# reads dart_test.yaml from the working directory, so this file serves
# runs from this package; runs from klabautermann/ (CI) load
# klabautermann/dart_test.yaml, which repeats the tags.
tags:
  shell:
  integration:
  runner-vm:
  runner-vm-s4:
  runner-vm-s6:
  soak:
  docker:
  inventory:
  sync:
