name: planchette_app
description: A focused desktop text editor built with the shared Planchette editor.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  file_picker: 11.0.3
  flutter:
    sdk: flutter
  path: 1.9.1
  planchette_core:
    path: ../../packages/planchette_core
  planchette_editor:
    path: ../../packages/planchette_editor
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
