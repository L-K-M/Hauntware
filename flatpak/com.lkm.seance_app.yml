# Flatpak manifest. scripts/build-flatpak.sh extracts the release .deb into
# dist/flatpak/stage and builds from that — the bundle ships the same files
# the .deb installs, relaid under flatpak's /app prefix.
id: com.lkm.seance_app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: seance
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU rendering for the Flutter embedder.
  - --device=dri
  # SSH client: sessions out, ssh-agent for auth, ssh_config/key import and
  # SFTP file transfer all need the user's real filesystem.
  - --share=network
  - --socket=ssh-auth
  - --filesystem=home
  # Vault secrets live in the host keyring (Secret Service API).
  - --talk-name=org.freedesktop.secrets
modules:
  - name: seance
    buildsystem: simple
    sources:
      - type: dir
        path: ../dist/flatpak/stage
    build-commands:
      - "if [ -d usr ]; then cp -a usr/. /app/; else cp -a . /app/; fi"
