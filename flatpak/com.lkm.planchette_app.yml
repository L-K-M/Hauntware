# Flatpak manifest. scripts/build-flatpak.sh extracts the release .deb into
# dist/flatpak/stage and builds from that — the bundle ships the same files
# the .deb installs, relaid under flatpak's /app prefix.
id: com.lkm.planchette_app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: planchette
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU rendering for the Flutter embedder.
  - --device=dri
  # Document open/save goes through the portal file chooser; the app is
  # local-only, so no filesystem or network permissions.
modules:
  - name: planchette
    buildsystem: simple
    sources:
      - type: dir
        path: ../dist/flatpak/stage
    build-commands:
      - cp -R . /app/
