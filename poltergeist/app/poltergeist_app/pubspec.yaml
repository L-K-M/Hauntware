name: poltergeist_app
description: Poltergeist cross-platform file transfer client.
publish_to: none
version: 1.9.2+1090299

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  # Cross-platform delivery for the desktop URL schemes in 04 §7.1.
  app_links: 7.2.1
  # All hosts consume the same local shared widgets.
  ghost_ui:
    path: ../../../planchette/packages/ghost_ui
  # SHA-256 scope and run keys for the sync trash (sync_trash_activity.dart).
  crypto: 3.0.7
  # OS file drop-in for the panes (02 §5.1, D14); desktop platforms only.
  desktop_drop: 0.7.1
  # The native executable picker behind Open With ▸ Other… on
  # Windows/Linux (06 §4.3); macOS uses the poltergeist/files channel.
  # Needs the AGP-9 Kotlin re-apply in android/build.gradle.kts.
  file_picker: 11.0.3
  # SVG rasterization for imported server-badge images (the mark picker's
  # image tab; the same use Séance's badge_image port makes of it).
  flutter_svg: 2.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The OS-keystore plugin behind ghost_keystore's MasterKeyManager, pinned
  # here so the plugin's native code and default options stay what this
  # app shipped with.
  flutter_secure_storage: 10.3.1
  intl: 0.20.3
  macos_window_utils: 1.9.1
  # The running build's version for the D19 update check (07 §3.10) —
  # version-matched to Séance's lock.
  package_info_plus: 8.3.1
  path: 1.9.1
  path_provider: 2.1.6
  # Applies owner-only mode bits to path-bearing local audit files.
  posix: 6.5.2
  # Share the editor and document layer directly; no host-owned fork.
  planchette_editor:
    path: ../../../planchette/packages/planchette_editor
  ghost_desktop:
    path: ../../../planchette/packages/ghost_desktop
  # The Android in-app update: download, verify and open the release APK.
  ghost_apk_update:
    path: ../../../planchette/packages/ghost_apk_update
  # The bundled monospace fonts behind the app's code stack.
  ghost_fonts:
    path: ../../../planchette/packages/ghost_fonts
  # Server badges and accents, shared with Séance.
  ghost_marks:
    path: ../../../planchette/packages/ghost_marks
  # The mark picker's image reader, over file_picker.
  ghost_marks_picker:
    path: ../../../planchette/packages/ghost_marks_picker
  # The server list's sectioning, shared with Séance.
  ghost_servers:
    path: ../../../planchette/packages/ghost_servers
  # The vault master key and API-key entries in the OS keystore, shared
  # with Séance and Klabautermann.
  ghost_keystore:
    path: ../../../planchette/packages/ghost_keystore
  poltergeist_core:
    path: ../../packages/poltergeist_core
  poltergeist_sync:
    path: ../../packages/poltergeist_sync
  # The update banner's "View release" link — hands the releases URL to
  # the OS browser; the app never downloads release assets (00 D23).
  url_launcher: 6.3.2
  uuid: 4.6.0
  window_manager: 0.5.2
  pdfrx: 2.6.1

# pdfrx's pdfium_dart 0.3.1, patched so its macOS copy of PDFium no longer
# overwrites the signed PDFium.framework (see
# third_party/pdfium_dart/PATCHES.md). Drop once upstream fixes it.
dependency_overrides:
  pdfium_dart:
    path: ../../third_party/pdfium_dart

dev_dependencies:
  # The shared localization contract scanner that replaced this app's local
  # copy (03 §3.5 F1b); test-only, nothing shipped.
  l10n_contract:
    path: ../../../tool/l10n_contract
  # MockClient for the update-check request-shape test (01 §6's pinned
  # egress contract); test-only, nothing shipped.
  http: 1.6.0
  fake_async: 1.3.3
  # flutter drive + the binding for the tier-B profile benchmark suites
  # (integration_test/perf/); app-side use only, nothing shipped.
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../media-sources/icon.png
  min_sdk_android: 24
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: ../../media-sources/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: ../../media-sources/icon.png
