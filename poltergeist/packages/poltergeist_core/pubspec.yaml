name: poltergeist_core
description: >-
  Platform-agnostic core for Poltergeist: connections, transfers, the sync
  engine, and the bookmark model per docs/plan/.
version: 1.9.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # D27: audited local ZIP framing/deflate. Exact because the driver depends
  # on low-level central-directory behavior, not the convenience extractors.
  archive: 4.3.0
  # Shared document layer: bounded loads and guarded saves, never copied.
  planchette_core:
    path: ../../../planchette/packages/planchette_core
  # D2: consume the shared SSH/sync implementation in this repository.
  seance_core:
    path: ../../../seance/packages/seance_core
  # Pinned exactly like seance_core pins it, and confined to
  # lib/src/connection/ by the CI import check (03 §1).
  dartssh2: 3.0.2
  # LocalFileSystem's streamed SHA-256 and cross-platform path
  # normalization (03 §1's sanctioned core dependencies).
  crypto: ^3.0.0
  path: ^1.9.0
  meta: ^1.15.0
  # Destination identity normalizes canonical Unicode equivalents before
  # collision checks. Pinned exactly because filename identity is persistent.
  unorm_dart: 0.3.2
  # The Linux inotify watch backend's native buffer/string marshalling
  # (dart:ffi has no allocator; 03 §7.5). Version matches the lockfile.
  ffi: ^2.2.0
  clock: ^1.1.3
  # D22's XML bookmark formats. Exact because import accepts untrusted files
  # and depends on this parser's no-DTD-resolution behavior.
  xml: 7.0.1

dev_dependencies:
  # Exercise the vault's locked primitives without changing runtime deps.
  cryptography: 2.9.0
  fake_async: ^1.3.3
  lints: ^5.0.0
  test: ^1.25.0
